name: Populate missing files (run once)

# Run this ONCE by hand (Actions tab -> this workflow -> Run workflow).
# It copies the native libraries, images, fonts and assets that are missing
# from this repo into the repo itself, so later builds no longer need any
# other repository.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Copy missing files from the pinned upstream commit
        run: |
          UP_SHA=824260b19bd3fb473b44ee5104d237e300733944
          curl -fL --retry 3 -o /tmp/upstream.zip \
            "https://codeload.github.com/east9-777/Nativo_ApkSamp/zip/$UP_SHA"
          mkdir -p /tmp/upstream
          unzip -q /tmp/upstream.zip -d /tmp/upstream
          UP="$(ls -d /tmp/upstream/*/)"
          UP="${UP%/}"
          rm -rf "$UP/.git" "$UP/.github" "$UP/README.md" "$UP/app/src/main/java/com/nativo"
          # copy only files this repo does not have (never overwrites your own edits)
          (cd "$UP" && find . -type f) | while IFS= read -r f; do
            if [ ! -e "$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "$UP/$f" "$f"
            fi
          done
          # drop placeholder XMLs that now have a real image/font with the same name
          for x in app/src/main/res/drawable/*.xml app/src/main/res/font/*.xml; do
            s="${x%.xml}"
            for e in png jpg jpeg webp ttf otf; do
              if [ -f "$s.$e" ]; then rm -f "$x"; echo "Removed placeholder: $x"; break; fi
            done
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to add - repo is already complete."
          else
            git commit -m "Add project files that were missing from the repo"
            git push
          fi
