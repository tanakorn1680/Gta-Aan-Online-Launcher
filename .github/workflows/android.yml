name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;25.1.8937393"

      - name: Make Gradle executable
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Fix CMakeLists - add cmake_minimum_required to all sub files
        run: |
          find app/src/main/cpp -name "CMakeLists.txt" | while read f; do
            if ! grep -q "cmake_minimum_required" "$f"; then
              sed -i '1s|^|cmake_minimum_required(VERSION 3.22.1)\n|' "$f"
              echo "Fixed: $f"
            fi
          done

      - name: Remove duplicate old Java package (com/nativo/rpg)
        run: |
          rm -rf app/src/main/java/com/nativo
          echo "Removed com/nativo/rpg"

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/GtaSanOnlineLauncher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GtaSanOnlineLauncher-release
          path: app/build/outputs/apk/release/GtaSanOnlineLauncher.apk
          if-no-files-found: error
