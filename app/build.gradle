plugins {
    id "com.android.application"
    id "com.joom.paranoid"
}

android {
    namespace "com.gtasan.online"
    compileSdk 35

    defaultConfig {
        applicationId "com.gtasan.online"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndkVersion "25.1.8937393"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters.add("armeabi-v7a")
            abiFilters.add("arm64-v8a")
        }
    }

    paranoid {
        applyToBuildTypes = "ALL"
    }

    buildTypes {
        release {
            // This source does not include a private release keystore.
            // The runner's automatically generated debug key makes the
            // GitHub Actions artifact installable for testing.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "GtaSanOnlineLauncher.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", includes: ["*.jar"])

    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.activity)
    implementation(libs.constraintlayout)
    implementation(libs.swiperefreshlayout)
    implementation(libs.navigation.fragment)
    implementation(libs.navigation.ui)
    implementation(libs.github.glide)

    implementation(libs.sdp.android)
    implementation(libs.ssp.android)

    implementation(libs.paranoid.gradle.plugin)

    implementation(libs.applovin.sdk)

    implementation(libs.easypermissions)
    implementation(libs.prdownloader)
    implementation(libs.okhttp)

    testImplementation(libs.junit)
    androidTestImplementation(libs.ext.junit)
    androidTestImplementation(libs.espresso.core)
}
