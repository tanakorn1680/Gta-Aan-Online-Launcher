name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;25.1.8937393"

      - name: Make Gradle executable
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Fallback - restore files missing from this repo (skipped once the repo is complete)
        if: hashFiles('app/src/main/jniLibs/arm64-v8a/libGTASA.so') == ''
        run: |
          UP_SHA=824260b19bd3fb473b44ee5104d237e300733944
          curl -fL --retry 3 -o /tmp/upstream.zip \
            "https://codeload.github.com/east9-777/Nativo_ApkSamp/zip/$UP_SHA"
          mkdir -p /tmp/upstream
          unzip -q /tmp/upstream.zip -d /tmp/upstream
          UP="$(ls -d /tmp/upstream/*/)"
          UP="${UP%/}"
          rm -rf "$UP/.git" "$UP/.github" "$UP/README.md" "$UP/app/src/main/java/com/nativo"
          # copy only files this repo does not have (never overwrites your own edits)
          (cd "$UP" && find . -type f) | while IFS= read -r f; do
            if [ ! -e "$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "$UP/$f" "$f"
            fi
          done
          # drop placeholder XMLs that now have a real image/font with the same name
          for x in app/src/main/res/drawable/*.xml app/src/main/res/font/*.xml; do
            s="${x%.xml}"
            for e in png jpg jpeg webp ttf otf; do
              if [ -f "$s.$e" ]; then rm -f "$x"; echo "Removed placeholder: $x"; break; fi
            done
          done
          ls -la app/src/main/jniLibs/arm64-v8a/libGTASA.so app/src/main/jniLibs/armeabi-v7a/libGTASA.so

      - name: Fix CMakeLists - add cmake_minimum_required to all sub files
        run: |
          find app/src/main/cpp -name "CMakeLists.txt" | while read f; do
            if ! grep -q "cmake_minimum_required" "$f"; then
              sed -i '1s|^|cmake_minimum_required(VERSION 3.22.1)\n|' "$f"
              echo "Fixed: $f"
            fi
          done

      - name: Remove duplicate old Java package (com/nativo/rpg)
        run: |
          rm -rf app/src/main/java/com/nativo
          echo "Removed com/nativo/rpg"

      - name: Verify native setup (fails fast with a clear reason)
        run: |
          OK_SHA64=1850e00f45189e57ac6695c3ffdd349846a9614fc340c1efec3a9b0ba8dd6804
          OK_SHA32=307ef4335db5f541c78032c44f6bb6ed6bf099a60e9bf25eb78b400a11cc5ef3
          L=app/src/main/cpp/Alyn_SAMPMOBILE/Memory/lib
          fail=0
          S="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "### Native setup check" >> "$S"

          check_lib() {  # abi expected_sha
            f="$L/$1/libGlossHook.a"
            if [ ! -f "$f" ]; then echo "- :x: $1 libGlossHook.a is missing" >> "$S"; echo "::error::$f is missing"; fail=1; return; fi
            got=$(sha256sum "$f" | cut -d' ' -f1); size=$(stat -c %s "$f")
            if [ "$got" = "$2" ]; then echo "- :white_check_mark: $1 libGlossHook.a = v1.9.2 ($size bytes)" >> "$S"
            else
              echo "- :x: $1 libGlossHook.a is NOT v1.9.2 (size $size bytes; v1.9.2 is 262248 arm64 / 229644 armv7)" >> "$S"
              echo "::error::$f is not GlossHook v1.9.2 (size $size). 1.9.5 (~296 KB) fails to link with NDK r25; 1.9.0 (~683 KB) crashes on Android 16. Re-commit the v1.9.2 files."
              fail=1
            fi
          }
          check_lib arm64-v8a "$OK_SHA64"
          check_lib armeabi-v7a "$OK_SHA32"

          if head -5 app/src/main/cpp/CMakeLists.txt | grep -q "project(Memory)"; then
            echo "- :x: app/src/main/cpp/CMakeLists.txt contains the Memory file (wrong top-level file)" >> "$S"
            echo "::error::app/src/main/cpp/CMakeLists.txt is the wrong file (project(Memory)). It must contain project(Alyn_SAMPMOBILE) and add_subdirectory(Alyn_SAMPMOBILE)."
            fail=1
          elif ! grep -q "add_subdirectory(Alyn_SAMPMOBILE)" app/src/main/cpp/CMakeLists.txt; then
            echo "- :x: top-level CMakeLists.txt does not add Alyn_SAMPMOBILE" >> "$S"
            echo "::error::top-level CMakeLists.txt does not contain add_subdirectory(Alyn_SAMPMOBILE)"
            fail=1
          else
            echo "- :white_check_mark: top-level CMakeLists.txt is correct" >> "$S"
          fi

          if grep -rIn "c++_shared\|ANDROID_STL" app/build.gradle --include=build.gradle >/dev/null 2>&1; then
            echo "- :warning: build.gradle sets the C++ STL (c++_shared / ANDROID_STL). The original has none; remove it." >> "$S"
            echo "::warning::build.gradle sets ANDROID_STL / c++_shared. The original project uses the default; remove it unless you know you need it."
          else
            echo "- :white_check_mark: default C++ STL" >> "$S"
          fi

          if grep -q 'ndkVersion "25.1.8937393"' app/build.gradle; then
            echo "- :white_check_mark: NDK 25.1.8937393" >> "$S"
          else
            echo "- :warning: ndkVersion in build.gradle is not 25.1.8937393" >> "$S"
            echo "::warning::ndkVersion in app/build.gradle is not 25.1.8937393 (the version this setup was verified with)"
          fi

          [ "$fail" = 0 ] || exit 1

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/GtaSanOnlineLauncher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GtaSanOnlineLauncher-release
          path: app/build/outputs/apk/release/GtaSanOnlineLauncher.apk
          if-no-files-found: error
